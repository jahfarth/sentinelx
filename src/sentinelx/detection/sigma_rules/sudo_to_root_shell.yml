title: Sudo to root shell
id: 54dfdae3-3bf0-4fb6-aca1-eda76f644e39
description: Detects sudo/su invocations that spawn an interactive root shell.
status: experimental
author: SentinelX
date: 2026-10-16
logsource:
  category: process_creation
  product: linux
detection:
  selection_img:
    Image: '*sudo*'
  selection_shell:
    CommandLine|contains:
      - 'sudo su'
      - 'su -'
      - '-i'
  condition: selection_img and selection_shell
level: high
tags:
  - attack.t1068
