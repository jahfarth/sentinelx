# SentinelX dashboard — nginx config for the production image.
#
# NOTE: proxy_pass has NO trailing slash on purpose. The FastAPI backend
# serves its routes at /api/v1/..., so the /api/ prefix must be preserved
# when proxying (a trailing slash would strip it and break every call).

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Liveness probe of the FastAPI backend.
    location = /healthz {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
    }

    # Reverse-proxy the API. Service name `api` comes from docker-compose.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE stream needs buffering disabled so alerts arrive in real time.
    location = /api/v1/stream {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1d;
    }

    # SPA fallback: any non-file route serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
